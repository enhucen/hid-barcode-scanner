name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs with Gradle
        run: |
          ./gradlew assembleDebug
          mkdir -p ./app/build/outputs/apk/release
          cp ./app/build/outputs/apk/debug/app-arm64-v8a-debug.apk ./app/build/outputs/apk/release/app-arm64-v8a-release.apk
          cp ./app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk ./app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          cp ./app/build/outputs/apk/debug/app-universal-debug.apk ./app/build/outputs/apk/release/app-universal-release.apk
          cp ./app/build/outputs/apk/debug/app-x86_64-debug.apk ./app/build/outputs/apk/release/app-x86_64-release.apk
          cp ./app/build/outputs/apk/debug/app-x86-debug.apk ./app/build/outputs/apk/release/app-x86-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          files: |
            ./app/build/outputs/apk/release/app-arm64-v8a-release.apk
            ./app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            ./app/build/outputs/apk/release/app-universal-release.apk
            ./app/build/outputs/apk/release/app-x86_64-release.apk
            ./app/build/outputs/apk/release/app-x86-release.apk